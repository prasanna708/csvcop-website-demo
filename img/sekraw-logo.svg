    <rect width="200" height="200" rx="24" fill="url(#sekrawNavy)"/>
    <circle cx="155" cy="49" r="14" fill="#FF8C1A"/>
    <text x="100" y="172" text-anchor="middle" font-family="system-ui, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="3">SEK RAW</text>
  </g>
  <!-- the wordmark beside it -->
  <rect x="116" y="46" width="3.5" height="48" fill="#FF8C1A"/>
  <text x="128" y="66" font-family="system-ui, 'Segoe UI', Arial, sans-serif" font-size="17.5" font-weight="800" fill="#FF8C1A" letter-spacing="3.2">BUSINESS</text>
  <text x="128" y="90" font-family="system-ui, 'Segoe UI', Arial, sans-serif" font-size="17.5" font-weight="800" fill="#FF8C1A" letter-spacing="3.2">SERVICES</text>
