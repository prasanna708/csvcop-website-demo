<?xml version="1.0" encoding="UTF-8"?>
<!-- SEK RAW Business Services: the mark shown in the header of https://www.sekraw.com (their inline SVG), reproduced
     here with their permission as CSVCOP's authorised distributor. Replace with an official file if they supply one. -->
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100" viewBox="0 0 300 100" role="img" aria-label="SEK RAW Business Services">
  <defs>
    <linearGradient id="sekrawNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2F59"/>
      <stop offset="100%" stop-color="#0F1B3D"/>
    </linearGradient>
  </defs>
  <!-- the square mark: 200-unit artwork drawn at half size -->
